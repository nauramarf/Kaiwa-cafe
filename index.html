<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaiwa Café</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f8f5ef;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
width:90%;
max-width:500px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;
}

h1{
color:#556b2f;
}

button{
padding:12px 20px;
margin:10px;
border:none;
background:#7aa874;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#658b5d;
}

#jp{
font-size:24px;
font-weight:bold;
margin:20px 0;
}

#id{
color:#666;
}

</style>

</head>


<body>


<div class="card">

<h1>🌸 Kaiwa Café</h1>


<div id="menu">

<p>Pilih latihan kaiwa</p>

<button onclick="openTalk()">
🎴 Talk Card
</button>

<br>

<button>
💭 Opinion
</button>

<br>

<button>
🌙 Deep Talk
</button>

</div>



<div id="game" style="display:none;">

<div id="jp"></div>

<div id="id"></div>

<button onclick="nextCard()">
🎲 Next Card
</button>

</div>


</div>



<script>


const talkCards=[

{
jp:"最近(さいきん)、一番(いちばん)うれしかったことは何(なん)ですか。",
id:"Hal apa yang paling membuatmu senang akhir-akhir ini?"
},

{
jp:"休(やす)みの日(ひ)は何(なに)をしますか。",
id:"Apa yang biasanya kamu lakukan saat hari libur?"
},

{
jp:"好(す)きな食(た)べ物(もの)は何(なん)ですか。",
id:"Apa makanan favoritmu?"
},

{
jp:"趣味(しゅみ)は何(なん)ですか。",
id:"Apa hobimu?"
}

];



function openTalk(){

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

nextCard();

}



function nextCard(){

const c=talkCards[Math.floor(Math.random()*talkCards.length)];


document.getElementById("jp").innerHTML=c.jp;

document.getElementById("id").innerHTML=c.id;


}



</script>


</body>
</html>
